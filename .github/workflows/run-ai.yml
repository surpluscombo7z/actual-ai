name: Run Actual AI Categorization

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Repository requires Node 22+
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Actual AI
        env:
          ACTUAL_SERVER_URL: ${{ secrets.ACTUAL_SERVER_URL }}
          ACTUAL_PASSWORD: ${{ secrets.ACTUAL_PASSWORD }}
          ACTUAL_BUDGET_ID: ${{ secrets.ACTUAL_BUDGET_ID }}
          LLM_PROVIDER: 'google-generative-ai'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FEATURES: '["dryRun", "classifyOnStartup", "syncAccountsBeforeClassify", "suggestNewCategories"]'
        run: npm start
