name: Run Actual AI Categorization

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Allows you to run it manually anytime from the GitHub UI

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci

      - name: Build TypeScript project
        run: npm run build

      - name: Run Actual AI (Dry Run)
        env:
          ACTUAL_SERVER_URL: ${{ secrets.ACTUAL_SERVER_URL }}
          ACTUAL_PASSWORD: ${{ secrets.ACTUAL_PASSWORD }}
          ACTUAL_BUDGET_ID: ${{ secrets.ACTUAL_BUDGET_ID }}
          ACTUAL_E2E_PASSWORD: ${{ secrets.ACTUAL_E2E_PASSWORD }} # Added for encrypted files
          LLM_PROVIDER: 'google-generative-ai'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FEATURES: '["dryRun", "classifyOnStartup", "syncAccountsBeforeClassify", "suggestNewCategories"]'
        run: node dist/app.js
